[package]
name = "ship16-rs"
version = "0.1.0"
edition = "2024"
repository.workspace = true
description = "An emulator for a custom 16-bit architecture called Ship-16"

[[bin]]
name = "ship16"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
isa = { path = "../isa" }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "cpu"
harness = false
